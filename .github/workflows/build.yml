name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DBykReply.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DBykReply-apk
          path: DBykReply.apk

      # Publish to a fixed "latest" release so the phone can download it directly.
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DBykReply.apk \
            --title "D Byk Reply (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +'%d %b %Y %H:%M UTC'). Download DBykReply.apk on your phone and open it to install."
